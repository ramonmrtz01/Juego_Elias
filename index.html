<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#75c9ef"><title>Juego para Elías</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#b9ecff,#fff4c8);color:#234}header{text-align:center;padding:18px 12px 8px}h1{margin:0;font-size:clamp(26px,6vw,38px);color:#17658b}header p{margin:5px 0 12px;font-weight:600}.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;justify-content:center;flex-wrap:wrap}.tab{border:0;border-radius:18px;padding:12px 16px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 8px #0002}.tab.active{background:#ffcb55;transform:scale(1.04)}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;max-width:760px;margin:auto}.tile{border:0;border-radius:22px;background:white;min-height:138px;padding:12px 6px;box-shadow:0 5px 12px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:opacity .2s,transform .2s}.tile:active{transform:scale(.96)}.emoji{font-size:clamp(48px,13vw,76px);line-height:1.1}.word{font-size:19px;font-weight:850}.tile.playing{opacity:.35}.tile.done{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}footer{text-align:center;padding:10px 12px 24px;font-size:13px;color:#456}.sound{font-size:13px;font-weight:700;color:#38718a;min-height:18px}button{cursor:pointer}
@media(min-width:600px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-height:170px}}@media(orientation:landscape) and (max-height:520px){header{padding:7px}.tabs{padding:3px}#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{min-height:112px}.emoji{font-size:42px}}
</style></head><body><header><h1>🌟 Juego para Elías 🌟</h1><p>¡Toca, escucha y aprende!</p><div class="sound" id="status" aria-live="polite">Elige una categoría para comenzar</div></header>
<nav class="tabs" id="tabs"></nav><main id="grid"></main><footer>Hecho con cariño para aprender jugando 💙</footer>
<script>
const groups=[
{name:'🐾 Animales',items:[['🐶','Perro','Guau, guau'],['🐱','Gato','Miau'],['🐮','Vaca','Muuu'],['🦁','León','Grrrr'],['🐘','Elefante','Prrrr'],['🐵','Mono','Uu, uu'],['🐸','Rana','Croac, croac'],['🐔','Gallina','Co, co, co'],['🦆','Pato','Cuac, cuac'],['🐑','Oveja','Beee']]},
{name:'🚗 Transportes',items:[['🚗','Carro','Brrrum, brrrum'],['🚌','Autobús','Piiii'],['🚒','Camión de bomberos','Nino, nino'],['🚑','Ambulancia','Nino, nino'],['🚲','Bicicleta','Ruedas girando'],['🚂','Tren','Chucu, chucu'],['✈️','Avión','Fuuuu'],['🚀','Cohete','Despegando: tres, dos, uno']]},
{name:'🍎 Frutas',items:[['🍎','Manzana','Manzana'],['🍌','Guineo','Guineo'],['🍊','Naranja','Naranja'],['🍇','Uvas','Uvas'],['🍓','Fresa','Fresa'],['🍍','Piña','Piña'],['🥭','Mango','Mango'],['🍉','Sandía','Sandía']]},
{name:'🔤 Vocales',items:[['🅰️','A','Aaaa'],['🅴','E','Eeee'],['ℹ️','I','Iiii'],['🅾️','O','Oooo'],['🇺','U','Uuuu']]}
];
let current=0,utterance=null,token=0;
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),status=document.getElementById('status');
function render(){tabs.innerHTML='';groups.forEach((g,i)=>{let b=document.createElement('button');b.className='tab'+(i===current?' active':'');b.textContent=g.name;b.onclick=()=>{stop();current=i;render()};tabs.appendChild(b)});grid.innerHTML='';groups[current].items.forEach(([emoji,name,sound])=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="emoji">'+emoji+'</span><span class="word">'+name+'</span>';b.onclick=()=>play(b,name,sound);grid.appendChild(b)})}
function speak(text,rate,done,id){if(!('speechSynthesis'in window)){status.textContent=text;setTimeout(()=>{if(id===token)done()},1200);return}let u=new SpeechSynthesisUtterance(text);u.lang='es-DO';u.rate=rate;u.pitch=1.05;u.onend=()=>{if(id===token)done()};u.onerror=()=>{if(id===token)done()};utterance=u;speechSynthesis.speak(u)}
function stop(){token++;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.tile').forEach(x=>x.classList.remove('playing'));status.textContent='Elige algo para aprender'}
function play(btn,name,sound){stop();const id=token;btn.classList.add('playing');status.textContent='Escucha: '+name;speak(name,0.88,()=>{status.textContent='Sonido: '+sound;speak(sound,0.95,()=>{if(id!==token)return;btn.classList.remove('playing');btn.classList.add('done');setTimeout(()=>btn.classList.remove('done'),400);status.textContent='¡Muy bien! Toca otro elemento'},id)},id)}
render();
</script></body></html>
